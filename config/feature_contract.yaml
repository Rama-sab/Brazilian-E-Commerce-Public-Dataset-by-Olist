suite_name: olist_inference_order_v1
required_columns:
  - order_purchase_timestamp
  - order_estimated_delivery_date
  - item_count
  - product_count
  - seller_count
  - total_price
  - total_freight
  - avg_item_price
  - max_item_price
  - product_category_count
  - customer_state
  - seller_state_mode
  - product_category_mode
  - payment_type_mode

base_numeric_features:
  - item_count
  - product_count
  - seller_count
  - total_price
  - total_freight
  - avg_item_price
  - max_item_price
  - product_category_count
  - product_name_length_mean
  - product_description_length_mean
  - product_photos_qty_mean
  - product_weight_g_mean
  - product_volume_cm3_mean
  - payment_count
  - payment_value_total
  - max_payment_installments
  - payment_type_count
  - customer_seller_distance_km

base_categorical_features:
  - customer_state
  - seller_state_mode
  - product_category_mode
  - payment_type_mode

engineered_numeric_features:
  - estimated_delivery_lead_days
  - purchase_year
  - purchase_month
  - purchase_dayofweek
  - purchase_hour
  - purchase_is_weekend
  - purchase_is_fixed_holiday

fixed_holidays:
  - [1, 1]
  - [4, 21]
  - [5, 1]
  - [9, 7]
  - [10, 12]
  - [11, 2]
  - [11, 15]
  - [12, 25]

numeric_ranges:
  item_count: {min: 1, max: 50, nullable: false}
  product_count: {min: 1, max: 50, nullable: false}
  seller_count: {min: 1, max: 20, nullable: false}
  total_price: {min: 0, max: 100000, nullable: false}
  total_freight: {min: 0, max: 10000, nullable: false}
  avg_item_price: {min: 0, max: 100000, nullable: false}
  max_item_price: {min: 0, max: 100000, nullable: false}
  product_category_count: {min: 0, max: 50, nullable: false}
  product_name_length_mean: {min: 0, max: 500, nullable: true}
  product_description_length_mean: {min: 0, max: 20000, nullable: true}
  product_photos_qty_mean: {min: 0, max: 100, nullable: true}
  product_weight_g_mean: {min: 0, max: 100000, nullable: true}
  product_volume_cm3_mean: {min: 0, max: 10000000, nullable: true}
  payment_count: {min: 1, max: 100, nullable: true}
  payment_value_total: {min: 0, max: 100000, nullable: true}
  max_payment_installments: {min: 0, max: 60, nullable: true}
  payment_type_count: {min: 1, max: 10, nullable: true}
  customer_seller_distance_km: {min: 0, max: 10000, nullable: true}
  estimated_delivery_lead_days: {min: 0, max: 180, nullable: false}

maximum_missing_rate:
  required: 0.0
  optional: 1.0

allowed_categories:
  customer_state: [AC, AL, AM, AP, BA, CE, DF, ES, GO, MA, MG, MS, MT, PA, PB, PE, PI, PR, RJ, RN, RO, RR, RS, SC, SE, SP, TO]
  seller_state_mode: [AM, BA, CE, DF, ES, GO, MA, MG, MS, MT, PA, PB, PE, PI, PR, RJ, RN, RO, RS, SC, SE, SP]
  payment_type_mode: [boleto, credit_card, debit_card, voucher]
