groups:
  - name: olist-inference
    rules:
      - alert: OlistApiHighErrorRate
        expr: >-
          sum(rate(olist_http_requests_total{status=~"5.."}[5m]))
          / clamp_min(sum(rate(olist_http_requests_total[5m])), 0.001) > 0.05
        for: 10m
        labels: {severity: critical}
        annotations:
          summary: Olist prediction API error rate exceeds 5 percent

      - alert: OlistApiHighP95Latency
        expr: >-
          histogram_quantile(0.95,
          sum by (le) (rate(olist_http_request_latency_seconds_bucket[5m]))) > 0.5
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: Olist prediction API p95 latency exceeds 500 ms

      - alert: OlistPredictionDistributionDrift
        expr: olist_prediction_drift_absolute_rate_difference > 0.12
        for: 30m
        labels: {severity: warning}
        annotations:
          summary: Rolling late-prediction rate differs materially from baseline

